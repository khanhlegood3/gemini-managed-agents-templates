name: Nightly Template Probe

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Validate templates and generate matrix
        id: matrix
        run: python scripts/probe_matrix.py
      - name: Check API key
        if: github.event_name != 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo '::error::Set the GEMINI_API_KEY repository Actions secret before running live probes.'
            exit 1
          fi

  probe:
    if: github.event_name != 'pull_request'
    needs: setup
    name: Probe ${{ matrix.template }} / ${{ matrix.chip }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Run probe
        id: run_probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEMPLATE: ${{ matrix.template }}
          CHIP: ${{ matrix.chip }}
          PROMPT: ${{ matrix.prompt }}
        run: |
          cd "$GITHUB_WORKSPACE/$TEMPLATE"
          python "$GITHUB_WORKSPACE/generate_payload.py" "$PROMPT" > "$RUNNER_TEMP/probe_payload.json"
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3 for $TEMPLATE / $CHIP"
            # curl can fail before receiving an HTTP status; do not let errexit skip retries.
            if HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/probe_response.log" -w '%{http_code}' \
              -X POST 'https://generativelanguage.googleapis.com/v1beta/interactions' \
              -H 'Content-Type: application/json' \
              -H 'Accept: text/event-stream' \
              -H 'Api-Revision: 2026-05-20' \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H 'x-server-timeout: 600' --max-time 660 \
              -d @"$RUNNER_TEMP/probe_payload.json"); then
              echo "HTTP status: $HTTP_CODE"
              if [ "$HTTP_CODE" = 200 ] && python "$GITHUB_WORKSPACE/scripts/probe_response.py" "$RUNNER_TEMP/probe_response.log"; then
                echo 'Probe succeeded.'
                exit 0
              fi
            else
              echo 'Request failed before a response was received.'
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo '::error::Probe failed after three attempts. Check API access and response status.'
          exit 1
      - name: Manage probe issue
        if: ${{ !cancelled() && github.event.repository.has_issues && (steps.run_probe.outcome == 'success' || steps.run_probe.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ matrix.template }}
          CHIP: ${{ matrix.chip }}
          STATUS: ${{ steps.run_probe.outcome }}
        run: |
          tag="$TEMPLATE / $CHIP"
          pending="[Pending] Probe Failed: $tag"
          active="Probe Failed: $tag"
          issue=$(gh issue list --state open --limit 1000 --json number,title | jq -r --arg pending "$pending" --arg active "$active" '.[] | select(.title == $pending or .title == $active) | .number')
          if [ "$STATUS" = success ]; then
            if [ -n "$issue" ]; then
              while IFS= read -r number; do
                gh issue close "$number" --comment "Probe succeeded in run $GITHUB_RUN_ID."
              done <<< "$issue"
            fi
          elif [ -z "$issue" ]; then
            gh issue create --title "$pending" --body "Probe failed for **$TEMPLATE** / **$CHIP** in run $GITHUB_RUN_ID. It will be promoted after two hours if it fails again."
          else
            while IFS= read -r number; do
              title=$(gh issue view "$number" --json title --jq .title)
              if [ "$title" = "$pending" ]; then
                created=$(gh issue view "$number" --json createdAt --jq .createdAt)
                age=$(( $(date +%s) - $(date -d "$created" +%s) ))
                if [ "$age" -ge 7200 ]; then
                  gh issue edit "$number" --title "$active"
                fi
              fi
              gh issue comment "$number" --body "Probe failed again in run $GITHUB_RUN_ID."
            done <<< "$issue"
          fi
